name: Release

# Tag a version (e.g. `git tag v0.1.0 && git push --tags`) to build the Windows
# installer and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']

# Serialize releases, but never cancel a run that may already be uploading
# artifacts - interrupting a publish can leave a half-created GitHub Release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build NSIS installer
        run: npm run dist -- --publish never   # build only; the next step publishes
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # no code-signing cert in CI
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
          body: |
            ### Install

            **Windows:** run `pixelpets.Setup.*.exe`. SmartScreen will show a blue
            "Windows protected your PC" screen because the build is not code-signed
            (a certificate costs real money for a free app). Click **More info**,
            then **Run anyway**.

            **macOS:** open the `.dmg`, drag the app to Applications, then open it
            once and allow it in **System Settings > Privacy & Security >
            Open Anyway**. A double-click will be refused by Gatekeeper first time,
            for the same reason. (macOS 14 and earlier: right-click > Open works too.)

            Prefer not to? [Play it in your browser](https://pixelcat-jet.vercel.app)
            or run it from source: `npm install && npm start`.

            The keyboard hook forwards a single "a key was pressed" boolean and never
            what you typed. See [SECURITY.md](https://github.com/JOhnsonKC201/pixelpets/blob/main/SECURITY.md).

          generate_release_notes: true

  build-macos:
    # Serialized behind the Windows job on purpose. Both jobs call action-gh-release
    # against the SAME tag, and the workflow-level concurrency block serializes runs,
    # not jobs within a run - so in parallel these are two concurrent create-or-update
    # calls on one release. They can collide outright, and whichever finishes last
    # overwrites the other's body. The realistic failure is the mac dmg quietly not
    # uploading while the Windows release looks perfectly fine.
    needs: build-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build macOS dmg/zip (unsigned)
        run: npm run dist:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # no Developer ID; scripts/adhoc-sign.js seals the bundle instead
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          body: |
            ### Install

            **Windows:** run `pixelpets.Setup.*.exe`. SmartScreen will show a blue
            "Windows protected your PC" screen because the build is not code-signed
            (a certificate costs real money for a free app). Click **More info**,
            then **Run anyway**.

            **macOS:** open the `.dmg`, drag the app to Applications, then open it
            once and allow it in **System Settings > Privacy & Security >
            Open Anyway**. A double-click will be refused by Gatekeeper first time,
            for the same reason. (macOS 14 and earlier: right-click > Open works too.)

            Prefer not to? [Play it in your browser](https://pixelcat-jet.vercel.app)
            or run it from source: `npm install && npm start`.

            The keyboard hook forwards a single "a key was pressed" boolean and never
            what you typed. See [SECURITY.md](https://github.com/JOhnsonKC201/pixelpets/blob/main/SECURITY.md).

          generate_release_notes: true
