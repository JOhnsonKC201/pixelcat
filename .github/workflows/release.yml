name: Release

# Tag a version (e.g. `git tag v0.1.0 && git push --tags`) to build the Windows
# installer and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']

# Serialize releases, but never cancel a run that may already be uploading
# artifacts - interrupting a publish can leave a half-created GitHub Release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build NSIS installer
        run: npm run dist -- --publish never   # build only; the next step publishes
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # no code-signing cert in CI
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
          generate_release_notes: true

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build macOS dmg/zip (unsigned)
        run: npm run dist:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # unsigned build; users right-click -> Open on first launch
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
