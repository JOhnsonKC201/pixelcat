name: Release

# Tag a version (e.g. `git tag v0.1.0 && git push --tags`) to build the Windows
# installer and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build NSIS installer
        run: npm run dist -- --publish never   # build only; the next step publishes
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # no code-signing cert in CI
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
          generate_release_notes: true
